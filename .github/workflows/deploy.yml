# Rebuild daily
name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # snapshot usually lands 02:30-05:00 UTC
    - cron: "0 8 * * *" # catch-up run if the first was too early
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: stats-v2-${{ github.run_id }}
          restore-keys: stats-v2-

      - run: npm ci

      - run: npm run build

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: stats-v2-${{ github.run_id }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=everythingmoe-stats --branch=main
